<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ADMIN | SATOSHI</title>
    <style>
        :root { --black: #000; --white: #fff; --gold: #FCD535; }
        body { margin: 0; background: #111; color: #fff; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .login-box { margin-top: 100px; background: #fff; color: #000; padding: 40px; border: 2px solid var(--gold); text-align: center; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .login-box h2 { letter-spacing: 5px; margin-bottom: 30px; font-weight: 300; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; font-family: inherit; box-sizing: border-box; outline: none; }
        .login-box input:focus { border-color: var(--gold); }
        .login-box button { width: 100%; padding: 15px; background: #000; color: #fff; border: none; cursor: pointer; margin-top: 10px; letter-spacing: 2px; transition: 0.3s; }
        .login-box button:hover { background: var(--gold); color: #000; }
        
        .admin-panel { display: none; width: 90%; max-width: 1000px; margin-top: 50px; }
        .panel-title { border-bottom: 1px solid #333; padding-bottom: 20px; letter-spacing: 5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #222; border: 1px solid #444; padding: 30px; }
        .card h3 { color: var(--gold); letter-spacing: 2px; margin-top: 0; font-weight: 300; }
        .btn { padding: 10px 20px; background: var(--gold); color: #000; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="loginBox" class="login-box">
        <h2>ADMIN ACCESS</h2>
        <input type="email" id="adminEmail" placeholder="Enter Admin Email">
        <input type="password" id="adminPass" placeholder="Enter Password">
        <button onclick="checkLogin()">LOGIN</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h1 class="panel-title">MASTER CONTROL</h1>
        <div class="grid">
            <div class="card">
                <h3>PENDING DEPOSITS</h3>
                <p style="font-size: 13px; color: #aaa;">Check email for TxID. Verify and approve.</p>
                <ul style="font-size: 13px; line-height: 2.5; padding-left: 0; list-style: none;">
                    <li style="display:flex; justify-content:space-between; border-bottom:1px solid #333;">User: 017XXXXXX - $2.00 <button class="btn" style="padding: 5px 10px; margin:0;">Approve</button></li>
                </ul>
            </div>
            <div class="card">
                <h3>PENDING WITHDRAWS</h3>
                <p style="font-size: 13px; color: #aaa;">Send via bKash/Binance and mark paid.</p>
                <ul style="font-size: 13px; line-height: 2.5; padding-left: 0; list-style: none;">
                    <li style="display:flex; justify-content:space-between; border-bottom:1px solid #333;">User: 017XXXXXX - $10.00 <button class="btn" style="padding: 5px 10px; margin:0;">Mark Paid</button></li>
                </ul>
            </div>
            <div class="card">
                <h3>POST MICRO JOB</h3>
                <input type="text" placeholder="Job Title" style="width: 100%; margin-bottom: 10px; padding: 8px;">
                <input type="text" placeholder="Image URL" style="width: 100%; margin-bottom: 10px; padding: 8px;">
                <button class="btn">POST</button>
            </div>
            <div class="card">
                <h3>POST ARTICLE</h3>
                <input type="text" placeholder="Article URL" style="width: 100%; margin-bottom: 10px; padding: 8px;">
                <button class="btn">POST</button>
            </div>
        </div>
    </div>

    <script>
        function checkLogin() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPass').value;
            
            // আপনার দেওয়া ইমেইল এবং পাসওয়ার্ড
            if (email === "zoomlink34@gmail.com" && pass === "KAWSARahmed22@@") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
            } else {
                alert("Access Denied! Invalid Email or Password.");
            }
        }
    </script>
</body>
</html>
