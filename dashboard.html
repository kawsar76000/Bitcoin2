<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DASHBOARD | SATOSHI</title>
    <style>
        :root { --black: #000; --white: #fff; --gold: #FCD535; --grey: #888; }
        body { margin: 0; background: var(--white); color: var(--black); font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { width: 100%; padding: 50px 0; text-align: center; border-bottom: 0.5px solid #000; }
        .header h1 { letter-spacing: 12px; text-transform: uppercase; font-weight: 300; margin: 0; font-size: 24px; }

        .container { width: 90%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; padding: 60px 0; }
        .card { border: 1px solid #eee; padding: 40px; background: #fafafa; text-align: center; }
        .card h4 { font-size: 10px; letter-spacing: 2px; color: var(--grey); margin-bottom: 10px; }
        .card h1 { font-size: 40px; margin: 0; font-weight: 100; color: var(--gold); }

        .form-box { border: 0.5px solid #000; padding: 30px; text-align: left; }
        .form-box h3 { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 0.5px solid #000; background: #fff; font-family: inherit; box-sizing: border-box; outline: none; }
        .btn { width: 100%; padding: 15px; background: #000; color: #fff; border: none; text-transform: uppercase; letter-spacing: 4px; cursor: pointer; font-size: 12px; transition: 0.3s; }
        .btn:hover { background: var(--gold); color: var(--black); }

        .ref-box { width: 100%; max-width: 1000px; border: 1px dashed #ccc; padding: 20px; margin-bottom: 40px; text-align: left; }
        .ref-box input { margin-bottom: 0; cursor: pointer; }
        
        .back-link { display: inline-block; margin-top: 30px; color: #000; font-weight: bold; text-decoration: none; border-bottom: 1px solid #000; font-size: 11px; letter-spacing: 2px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dashboard</h1>
    </div>

    <div class="ref-box">
        <label style="font-size: 10px; font-weight: bold; letter-spacing: 2px;">YOUR INVITE / REFERRAL LINK</label>
        <input type="text" id="ref-link" value="https://satoshi-ebce7.web.app/?ref=USER123" readonly onclick="this.select(); document.execCommand('copy'); alert('Referral Link Copied!');">
    </div>

    <div class="container">
        <div>
            <div class="card" style="margin-bottom: 20px;">
                <h4>TOTAL BALANCE</h4>
                <h1 id="balance">$0.00</h1>
            </div>
            <div class="card">
                <h4>TOTAL REFERRALS</h4>
                <h1 id="referrals">0</h1>
            </div>
        </div>

        <div class="form-box">
            <h3>WITHDRAW FUNDS</h3>
            <p style="font-size: 10px; color: #666; margin-bottom: 15px;">Min: $5. Fee: $1. (Increments of $5).</p>
            <select id="w-method">
                <option value="bkash">bKash</option>
                <option value="binance">Binance</option>
            </select>
            <input type="text" id="w-number" placeholder="Enter Number/Address">
            
            <input type="number" id="w-amount" placeholder="Amount (e.g. 5, 10, 15)" min="5" step="5">
            
            <button class="btn" onclick="requestWithdraw()">REQUEST WITHDRAW</button>
        </div>
    </div>

    <a href="index.html" class="back-link">← BACK TO HOME</a>
    <br><br>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('balance').innerText = "$0.00"; // রিয়েল ডাটা ফায়ারবেস থেকে আসবে
                document.getElementById('referrals').innerText = "0";
                document.getElementById('ref-link').value = `https://satoshi-ebce7.web.app/?ref=${user.uid.slice(0,6)}`;
            }
        });

        window.requestWithdraw = function() {
            const amount = parseFloat(document.getElementById('w-amount').value);
            if (isNaN(amount) || amount < 5) {
                alert("Minimum withdrawal amount is $5.");
                return;
            }
            if (amount % 5 !== 0) {
                alert("Withdrawal amount must be in increments of $5 (e.g., $5, $10, $15).");
                return;
            }
            alert(`Withdrawal Request for $${amount} submitted. $1 fee applied. You will receive $${amount}.`);
        }
    </script>
</body>
</html>
