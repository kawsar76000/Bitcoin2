<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PIXEL GENESIS | SATOSHI</title>
    <style>
        :root { --black: #000; --white: #fff; --gold: #FCD535; }
        body { margin: 0; background: var(--white); color: var(--black); font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; padding: 40px 0; text-align: center; border-bottom: 0.5px solid #000; position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(5px); z-index: 10; }
        .header h1 { letter-spacing: 10px; text-transform: uppercase; font-weight: 300; margin: 0; font-size: 22px; }

        .grid-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; max-width: 900px; margin: 40px auto; padding: 10px; }
        .block { 
            width: 100px; height: 100px; background: #fafafa; border: 1px solid #ddd; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            transition: 0.3s; cursor: pointer; box-sizing: border-box;
        }
        .block:hover { background: var(--gold); border-color: var(--black); transform: scale(1.05); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .block span { font-size: 14px; font-weight: bold; }
        .block small { font-size: 10px; color: #666; margin-top: 5px; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #fff; border: 2px solid #000; padding: 40px; max-width: 400px; text-align: center; box-shadow: 10px 10px 0 #000; }
        .modal-content h2 { letter-spacing: 2px; font-size: 18px; }
        .modal-content p { font-size: 13px; word-break: break-all; border: 1px dashed #ccc; padding: 10px; cursor: pointer; background: #fafafa; }
        .btn { background: #000; color: #fff; padding: 15px 30px; border: none; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        .btn:hover { background: var(--gold); color: #000; }
        
        .back-link { color: #000; font-weight: bold; text-decoration: none; border-bottom: 1px solid #000; font-size: 11px; letter-spacing: 2px; margin: 30px 0; display: inline-block; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pixel Genesis ($2 / Block)</h1>
    </div>

    <div class="grid-container" id="grid"></div>
    <a href="index.html" class="back-link">← BACK TO HOME</a>

    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2>ACQUISITION</h2>
            <p style="font-weight: bold; border: none; background: none;" id="blockInfo">Block #1</p>
            <p style="border: none; font-size: 12px; color: #666; padding: 0; background: none;">Send exactly <b>$2 USDT</b> (BEP20) to:</p>
            <p onclick="navigator.clipboard.writeText('0x6be5b73e44ad0b5a2845394c116d1babab8174f0'); alert('Address Copied!');" title="Click to copy">
                0x6be5b73e44ad0b5a2845394c116d1babab8174f0
            </p>
            <p style="border: none; font-size: 10px; padding: 0; background: none;">After payment, email TxID to <b>zoomlink34@gmail.com</b>.</p>
            <button class="btn" onclick="document.getElementById('orderModal').style.display='none'">CLOSE</button>
        </div>
    </div>

    <script>
        const grid = document.getElementById('grid');
        let blockCount = 0;
        let isLoading = false;

        function loadBlocks(count) {
            for (let i = 0; i < count; i++) {
                blockCount++;
                const block = document.createElement('div');
                block.className = 'block';
                block.innerHTML = `<span>#${blockCount}</span><small>$2</small>`;
                block.onclick = () => {
                    document.getElementById('blockInfo').innerText = `Block #${blockCount}`;
                    document.getElementById('orderModal').style.display = 'flex';
                };
                grid.appendChild(block);
            }
            isLoading = false;
        }

        // প্রথমে ৬০টি ব্লক লোড হবে
        loadBlocks(60);

        // স্ক্রল করলে আরও ৬০টি করে ব্লক যুক্ত হবে (লিমিট নেই)
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200 && !isLoading) {
                isLoading = true;
                // লোডিং ইফেক্ট দেখানোর জন্য সামান্য টাইমআউট
                setTimeout(() => {
                    loadBlocks(60);
                }, 300);
            }
        });
    </script>
</body>
</html>
