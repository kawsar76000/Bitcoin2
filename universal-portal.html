<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LEDGER | SATOSHI</title>
    <style>
        body { margin: 0; background: #fff; color: #000; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .portal-header { width: 100%; padding: 50px 0; text-align: center; border-bottom: 0.5px solid #000; }
        .container { width: 90%; max-width: 1100px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 60px; padding: 60px 0; }
        h2 { font-size: 13px; letter-spacing: 4px; text-transform: uppercase; border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 30px; font-weight: bold; }
        .form-area input, .form-area select { width: 100%; padding: 14px; margin-bottom: 15px; border: 0.5px solid #000; font-family: inherit; box-sizing: border-box; outline: none; }
        .btn-submit { width: 100%; padding: 16px; background: #000; color: #fff; border: none; text-transform: uppercase; letter-spacing: 4px; cursor: pointer; }
        .history-table { width: 100%; border-collapse: collapse; }
        .history-table th, .history-table td { border-bottom: 1px solid #eee; padding: 15px 12px; text-align: left; font-size: 14px; }
        .plot-id { background: #000; color: #fff; padding: 3px 8px; font-size: 10px; font-weight: bold; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="portal-header">
        <h1 style="letter-spacing: 12px; text-transform: uppercase; font-weight: 300; margin: 0; font-size: 24px;">Estate Portal</h1>
        <p style="font-size: 9px; letter-spacing: 3px; margin-top: 8px; color: #666;">CENTRAL ARCHIVE LEDGER</p>
    </div>

    <div class="container">
        <div class="form-area">
            <h2>Registration</h2>
            <input type="text" placeholder="OWNER NAME / BRAND">
            <input type="text" placeholder="PLOT NUMBER (E.G. 01)">
            <button class="btn-submit">Submit Entry</button>
            <a href="index.html" style="display:block; margin-top:30px; font-size:10px; color:#000;">[ ← RETURN TO HOME ]</a>
        </div>
        <div class="history-area">
            <h2>Ownership History</h2>
            <table class="history-table">
                <thead>
                    <tr><th>Plot</th><th>Identity</th><th>Section</th></tr>
                </thead>
                <tbody>
                    <tr><td><span class="plot-id">#01</span></td><td>KAWSAR</td><td style="color:#666;">Pixel Genesis</td></tr>
                    <tr><td><span class="plot-id">#02</span></td><td>SATOSHI</td><td style="color:#666;">Pixel Genesis</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
